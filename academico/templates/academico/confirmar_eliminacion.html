{% extends "base.html" %}
{% block titulo %}Eliminar {{ titulo|lower }} · Sistema Académico{% endblock %}

{% block contenido %}
<section class="crud-page">
  <div class="card confirm-card">
    <div class="card-body">
      <span class="eyebrow">CONFIRMAR ACCIÓN</span>
      <h1>Eliminar {{ titulo|lower }}</h1>
      <p>¿Seguro que deseas eliminar <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
      <form method="post" class="form-actions">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a class="btn btn-outline-secondary" href="{% url 'academico:lista' modelo %}">Cancelar</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
